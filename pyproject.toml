[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-mcp"
version = "2.0.0"
description = "Enterprise-grade Model Context Protocol (MCP) server for deep, comprehensive control over Blender 3D"
readme = "README.md"
authors = [
  { name = "Jose Eduardo Rojas Jimenez", email = "jxoesneon@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=1.10.0",
]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
